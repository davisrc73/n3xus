version: '3.8'

services:
  pocketbase:
    image: elestio/pocketbase:latest
    container_name: pl-pocketbase
    restart: unless-stopped
    command: serve --http="0.0.0.0:8045" --dir="/pb_data"
    ports:
      - "8045:8045"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8045/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pl-frontend
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_POCKETBASE_URL=http://pocketbase:8045
    depends_on:
      - pocketbase
